# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test ${{ matrix.os }} (node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Go (BoringSSL build)
        uses: actions/setup-go@v7.1.0
        with:
          go-version: 'stable'

      - name: Install NASM (Windows, BoringSSL asm)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1.5.2

      - name: Install CMake/Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Install CMake/Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Cache cargo
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'vendor/quiche/Cargo.lock') }}

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install npm deps (skip native postinstall)
        run: npm ci
        env:
          RWEBTRANSPORT_SKIP_POSTINSTALL: '1'

      - name: Build native addon
        run: npm run build:rust

      - name: Build echo-server test fixture
        run: cargo build --locked --release -p rwebtransport-echo-server

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Native protocol regressions
        run: cargo test --locked --release -p rwebtransport-native -p rwebtransport-wtcore

      - name: Vendored QUIC transport tests
        if: runner.os == 'Linux' && matrix.node == 26
        run: cargo test --locked --manifest-path vendor/quiche/Cargo.toml --target-dir target --features sfv,qlog,ffi --lib

      - name: Test
        run: npm test

      - name: Chrome interoperability
        if: runner.os == 'Linux' && matrix.node == 26
        run: npm run test:browser
